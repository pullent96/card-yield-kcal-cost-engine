[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-yield-kcal-cost-engine"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.scripts]
recipe-engine = "card_engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["card_engine*"]
